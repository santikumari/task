name: Prod Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run final tests
        working-directory: app
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (prod)
        working-directory: app
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:prod .

      - name: Push image to Docker Hub (prod)
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:prod

      - name: Deploy to PROD server via SSH
        uses: appleboy/ssh-action@v1.8.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -e
            docker pull ${{ secrets.DOCKER_USERNAME }}/myapp:prod
            docker stop myapp-prod || true
            docker rm myapp-prod || true
            docker run -d --name myapp-prod \
              --env-file /opt/myapp/.env.prod \
              -p 80:3000 \
              ${{ secrets.DOCKER_USERNAME }}/myapp:prod

      - name: Send simple notification
        run: |
          echo "Production deployed to ${{ secrets.PROD_SSH_HOST }} at $(date)"
