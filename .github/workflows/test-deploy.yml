name: Test Deploy

on:
  push:
    branches:
      - test

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run unit tests
        working-directory: app
        run: npm test

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: ./app
        continue-on-error: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image (test)
        working-directory: app
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/myapp:test .

      - name: Push Docker image (test)
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:test

      - name: Deploy to TEST server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          port: ${{ secrets.TEST_SSH_PORT }}
          script: |
            set -e
            docker pull ${{ secrets.DOCKER_USERNAME }}/myapp:test
            docker stop myapp-test || true
            docker rm myapp-test || true
            docker run -d --name myapp-test \
              --env-file /opt/myapp/.env.test \
              -p 80:3000 \
              ${{ secrets.DOCKER_USERNAME }}/myapp:test
